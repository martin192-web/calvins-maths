</style></head><body><main class="app"><header class="top"><h1>🦕 Calvin's Maths Adventures 🦖</h1><p class="subtitle">Explore Dino Island, solve maths puzzles and collect dinosaur stars!</p></header>
<section class="panel"><div class="controls" aria-label="Game mode"><button class="choice selected" data-mode="add">➕ Adding</button><button class="choice" data-mode="subtract">➖ Taking away</button><button class="choice" data-mode="mixed">🎲 Mix it up!</button></div><p class="small">Choose your challenge</p><div class="controls" aria-label="Difficulty"><button class="choice selected" data-level="easy">🥚 Hatchling · 5</button><button class="choice" data-level="medium">🦕 Explorer · 10</button><button class="choice" data-level="tricky">🦖 T-Rex · 20</button><button class="toggle" id="auto" aria-pressed="false">✨ Auto level: Off</button></div></section>
<section class="panel stats" aria-live="polite"><div>⭐ Stars: <span id="stars">0</span></div><div>🔥 Streak: <span id="streak">0</span></div><div>🏆 Best: <span id="best">0</span></div></section>
<section class="panel question"><div class="level" id="levelLabel">🐣 Easy Explorer</div><div class="equation" id="equation" aria-live="polite"></div><div class="visual" id="visual" aria-label="Counting picture"></div><p class="small" id="hint">Count the pictures to help you!</p><div class="answer-grid" id="answers"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="next" id="next" hidden>Next puzzle ➜</button><div class="progress" aria-label="Progress to next level"><div class="bar" id="bar"></div></div><p class="small" id="progressText">Get 5 correct answers in a row to level up when Auto level is on.</p></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),levels=['easy','medium','tricky'],maxes={easy:5,medium:10,tricky:20},names={easy:'🥚 Dino Hatchling',medium:'🦕 Dino Explorer',tricky:'🦖 T-Rex Champion'};let mode='add',level='easy',auto=false,stars=0,streak=0,best=0,question=null,locked=false,correctRun=0,wrongAttempts=0;try{const saved=JSON.parse(localStorage.getItem('calvin-maths-progress')||'{}');stars=Number(saved.stars)||0;best=Number(saved.best)||0;if(levels.includes(saved.level))level=saved.level;mode=['add','subtract','mixed'].includes(saved.mode)?saved.mode:mode;}catch(e){}$('stars').textContent=stars;$('best').textContent=best;const save=()=>{try{localStorage.setItem('calvin-maths-progress',JSON.stringify({stars,best,level,mode}))}catch(e){}};const rand=n=>Math.floor(Math.random()*(n+1));function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(i);[a[i],a[j]]=[a[j],a[i]]}return a}function draw(){locked=false;wrongAttempts=0;const max=maxes[level],op=mode==='mixed'?(Math.random()<.5?'add':'subtract'):mode;let a,b;if(op==='add'){a=rand(max);b=rand(max-a);if(a===0&&b===0)b=1}else{a=rand(max);b=rand(a);if(a===0&&b===0)a=1}const result=op==='add'?a+b:a-b;question={a,b,op,result};$('equation').textContent=`${a} ${op==='add'?'+':'−'} ${b} = ?`;$('levelLabel').textContent=names[level];const visual=$('visual');visual.innerHTML='';const group=(n,emoji)=>{const d=document.createElement('div');d.className='dots';for(let i=0;i<n;i++){const s=document.createElement('span');s.className='dot';s.textContent=emoji;d.appendChild(s)}return d};visual.append(group(a,'🥚'));const sign=document.createElement('span');sign.className='symbol';sign.textContent=op==='add'?'+':'−';visual.append(sign,group(b,op==='add'?'🦴':'🥚'));$('hint').textContent=op==='add'?'Count the dinosaur eggs and bones together!':'Start with the dinosaur eggs and take some away!';const options=new Set([result]);const pool=shuffle(Array.from({length:max+1},(_,i)=>i).filter(x=>x!==result));for(const n of pool){if(options.size===4)break;options.add(n)}const answers=$('answers');answers.innerHTML='';shuffle([...options]).forEach(n=>{const btn=document.createElement('button');btn.className='answer';btn.textContent=n;btn.setAttribute('aria-label',`Answer ${n}`);btn.onclick=()=>check(n,btn);answers.append(btn)});$('feedback').textContent='';$('next').hidden=true;updateProgress()}
function check(n,btn){if(locked)return;if(n===question.result){locked=true;stars++;if(wrongAttempts===0){streak++;correctRun++;}else{streak=0;correctRun=0}best=Math.max(best,streak);$('stars').textContent=stars;$('streak').textContent=streak;$('best').textContent=best;btn.classList.add('correct','celebrate');document.querySelectorAll('.answer').forEach(b=>b.disabled=true);const messages=['🦖 Roarsome!','🥚 Egg-cellent!','🦕 Dino-mite maths!','🌋 Jurassic genius!','⭐ Super explorer!'];$('feedback').textContent=messages[rand(messages.length-1)];if(auto&&correctRun>=5){const i=levels.indexOf(level);if(i<levels.length-1){level=levels[i+1];correctRun=0;$('feedback').textContent='🏆 Dino level up! Roarsome!';syncButtons()}else correctRun=5}$('next').hidden=false;save()}else{wrongAttempts++;streak=0;correctRun=0;$('streak').textContent='0';btn.classList.add('wrong');btn.disabled=true;$('feedback').textContent='💪 Good try! Have another go!'}updateProgress()}
function updateProgress(){$('bar').style.width=`${Math.min(5,correctRun)*20}%`;$('progressText').textContent=auto?(level==='tricky'?'You are on the top level! Keep collecting stars!':`${Math.max(0,5-correctRun)} more first-try answers in a row to level up!`):'Turn on Auto level to move up after 5 first-try answers in a row.'}
function syncButtons(){document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('selected',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});document.querySelectorAll('[data-level]').forEach(b=>{b.classList.toggle('selected',b.dataset.level===level);b.setAttribute('aria-pressed',String(b.dataset.level===level))})}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;correctRun=0;syncButtons();save();draw()});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;correctRun=0;syncButtons();save();draw()});$('auto').onclick=()=>{auto=!auto;$('auto').setAttribute('aria-pressed',String(auto));$('auto').textContent=`✨ Auto level: ${auto?'On':'Off'}`;updateProgress()};$('next').onclick=draw;syncButtons();draw();if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}})();
</script></body></html>
